name: Build, Release & Publish to AUR

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    name: Build and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Package Release
        run: |
          cd build/linux/x64/release/bundle
          tar -czvf ../../../../../nexus-aur-linux-x86_64.tar.gz .
          cd -

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: nexus-aur-linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          # Estrae la versione dal tag (es. v1.0.0 -> 1.0.0)
          TAG_VERSION=${GITHUB_REF#refs/tags/v}

          # Calcola lo SHA256 dell'archivio generato
          SHA256=$(sha256sum nexus-aur-linux-x86_64.tar.gz | awk '{print $1}')

          echo "Versione target AUR: $TAG_VERSION"
          echo "SHA256: $SHA256"

          # Configura la chiave SSH per connettersi ad AUR
          mkdir -p ~/.ssh
          echo "$AUR_SSH_KEY" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key

          cat << EOF > ~/.ssh/config
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur_key
            StrictHostKeyChecking no
          EOF

          # Clona la repository AUR del pacchetto
          git clone ssh://aur@aur.archlinux.org/nexus-aur-bin.git aur_repo
          cd aur_repo

          # Imposta le credenziali per il commit su AUR
          git config user.name "IlNinjaDiBattipaglia"
          git config user.email "fogliadonato2@gmail.com"

          # Aggiorna versione, pkgrel e checksum sha256sum nel PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=$TAG_VERSION/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i "s/sha256sums=('.*')/sha256sums=('$SHA256')/" PKGBUILD

          # Rigenera il file .SRCINFO richiesto da AUR
          makepkg --printsrcinfo > .SRCINFO

          # Invia le modifiche su AUR tramite git
          git add PKGBUILD .SRCINFO
          git commit -m "Update to version $TAG_VERSION"
          git push origin master
