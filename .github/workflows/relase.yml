name: Build, Release & Publish to AUR

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    name: Build, Package and Publish
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev wget

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Package Tarball and AppImage
        run: |
          BUNDLE_DIR="build/linux/x64/release/bundle"
          
          # --- 1. Creazione Tarball standard ---
          cd "$BUNDLE_DIR"
          mkdir -p share/applications share/icons/hicolor/512x512/apps
          cp ../../../../../nexus-aur.desktop share/applications/
          cp ../../../../../assets/icon.png share/icons/hicolor/512x512/apps/nexus-aur.png
          tar -czvf ../../../../../nexus-aur-linux-x86_64.tar.gz .
          cd -

          # --- 2. Creazione AppImage ---
          wget -O appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/512x512/apps
          cp -r "$BUNDLE_DIR"/* AppDir/usr/bin/
          cp nexus-aur.desktop AppDir/usr/share/applications/
          cp assets/icon.png AppDir/usr/share/icons/hicolor/512x512/apps/nexus-aur.png
          
          cp nexus-aur.desktop AppDir/nexus-aur.desktop
          cp assets/icon.png AppDir/nexus-aur.png
          
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/nexus_aur" "$@"
          EOF
          chmod +x AppDir/AppRun

          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir nexus-aur-x86_64.AppImage

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nexus-aur-linux-x86_64.tar.gz
            nexus-aur-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to AUR Natively
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          SHA256=$(sha256sum nexus-aur-linux-x86_64.tar.gz | awk '{print $1}')
          
          echo "Versione target AUR: $TAG_VERSION"
          echo "SHA256: $SHA256"

          # Configurazione SSH
          mkdir -p ~/.ssh
          echo "$AUR_SSH_KEY" > ~/.ssh/aur_key
          tr -d "\r" < ~/.ssh/aur_key > ~/.ssh/aur_key_fixed
          mv ~/.ssh/aur_key_fixed ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          
          cat << 'EOF' > ~/.ssh/config
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur_key
            StrictHostKeyChecking no
            User aur
          EOF

          # Clona il repo AUR
          git clone ssh://aur@aur.archlinux.org/nexus-aur-bin.git aur_repo
          cd aur_repo

          git config user.name "IlNinjaDiBattipaglia"
          git config user.email "fogliadonato2@gmail.com"

          # Aggiorna PKGBUILD (gestendo spazi e resettando pkgrel a 1)
          sed -i "s/^pkgver[[:space:]]*=.*/pkgver=$TAG_VERSION/" PKGBUILD
          sed -i "s/^pkgrel[[:space:]]*=.*/pkgrel=1/" PKGBUILD
          sed -i "s/sha256sums=('[^']*')/sha256sums=('$SHA256')/" PKGBUILD

          # Aggiorna .SRCINFO (version, rel e sha256)
          sed -i "s/[[:space:]]*pkgver[[:space:]]*=.*/\tpkgver = $TAG_VERSION/" .SRCINFO
          sed -i "s/[[:space:]]*pkgrel[[:space:]]*=.*/\tpkgrel = 1/" .SRCINFO
          sed -i "s/[[:space:]]*sha256sums[[:space:]]*=.*/\tsha256sums = $SHA256/" .SRCINFO

          git add PKGBUILD .SRCINFO
          git commit -m "Update to version $TAG_VERSION (pkgrel reset to 1)"
          git push origin master
