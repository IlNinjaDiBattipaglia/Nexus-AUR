name: Build, Release & Publish to AUR

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    name: Build and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Package Release
        run: |
          cd build/linux/x64/release/bundle
          # Inserisce icona e file desktop nel bundle prima della compressione
          mkdir -p share/applications share/icons/hicolor/512x512/apps
          cp ../../../../../nexus-aur.desktop share/applications/
          cp ../../../../../assets/icon.png share/icons/hicolor/512x512/apps/nexus-aur.png

          # Crea l'archivio tar.gz finale
          tar -czvf ../../../../../nexus-aur-linux-x86_64.tar.gz .
          cd -

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: nexus-aur-linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          SHA256=$(sha256sum nexus-aur-linux-x86_64.tar.gz | awk '{print $1}')

          echo "Versione target AUR: $TAG_VERSION"
          echo "SHA256: $SHA256"

          mkdir -p ~/.ssh
          echo "$AUR_SSH_KEY" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key

          cat << EOF > ~/.ssh/config
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur_key
            StrictHostKeyChecking no
          EOF

          git clone ssh://aur@aur.archlinux.org/nexus-aur-bin.git aur_repo
          cd aur_repo

          git config user.name "IlNinjaDiBattipaglia"
          git config user.email "fogliadonato2@gmail.com"

          sed -i "s/^pkgver=.*/pkgver=$TAG_VERSION/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i "s/sha256sums=('.*')/sha256sums=('$SHA256')/" PKGBUILD

          makepkg --printsrcinfo > .SRCINFO

          git add PKGBUILD .SRCINFO
          git commit -m "Update to version $TAG_VERSION"
          git push origin master
