name: Build, Release & Publish to AUR

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    name: Build, Package and Publish
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev wget

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Package Tarball and AppImage
        run: |
          BUNDLE_DIR="build/linux/x64/release/bundle"
          
          # --- 1. Creazione Tarball standard ---
          cd "$BUNDLE_DIR"
          mkdir -p share/applications share/icons/hicolor/512x512/apps
          cp ../../../../../nexus-aur.desktop share/applications/
          cp ../../../../../assets/icon.png share/icons/hicolor/512x512/apps/nexus-aur.png
          tar -czvf ../../../../../nexus-aur-linux-x86_64.tar.gz .
          cd -

          # --- 2. Creazione AppImage ---
          wget -O appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/512x512/apps
          cp -r "$BUNDLE_DIR"/* AppDir/usr/bin/
          cp nexus-aur.desktop AppDir/usr/share/applications/
          cp assets/icon.png AppDir/usr/share/icons/hicolor/512x512/apps/nexus-aur.png
          
          cp nexus-aur.desktop AppDir/nexus-aur.desktop
          cp assets/icon.png AppDir/nexus-aur.png
          
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/nexus_aur" "$@"
          EOF
          chmod +x AppDir/AppRun

          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir nexus-aur-x86_64.AppImage

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nexus-aur-linux-x86_64.tar.gz
            nexus-aur-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to AUR via Arch Linux Container
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          SHA256=$(sha256sum nexus-aur-linux-x86_64.tar.gz | awk '{print $1}')
          
          echo "Versione target AUR: $TAG_VERSION"
          echo "SHA256: $SHA256"

          docker run --rm \
            -e AUR_SSH_KEY="$AUR_SSH_KEY" \
            -e TAG_VERSION="$TAG_VERSION" \
            -e SHA256="$SHA256" \
            -v "$(pwd)":/workspace \
            archlinux:base-devel \
            bash -c '
              pacman -Sy --noconfirm git openssh
              
              mkdir -p /root/.ssh
              echo "$AUR_SSH_KEY" > /root/.ssh/aur_key
              tr -d "\r" < /root/.ssh/aur_key > /root/.ssh/aur_key_fixed
              mv /root/.ssh/aur_key_fixed /root/.ssh/aur_key
              chmod 600 /root/.ssh/aur_key
              
              cat << "EOF" > /root/.ssh/config
              Host aur.archlinux.org
                IdentityFile /root/.ssh/aur_key
                StrictHostKeyChecking no
                User aur
              EOF

              cd /workspace
              git clone ssh://aur@aur.archlinux.org/nexus-aur-bin.git aur_repo
              cd aur_repo

              git config --global --add safe.directory /workspace/aur_repo
              git config user.name "IlNinjaDiBattipaglia"
              git config user.email "fogliadonato2@gmail.com"

              sed -i "s/^pkgver=.*/pkgver=$TAG_VERSION/" PKGBUILD
              sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
              sed -i "s/sha256sums=('\x27.*\x27')/sha256sums=('$SHA256')/" PKGBUILD

              makepkg --printsrcinfo > .SRCINFO

              git add PKGBUILD .SRCINFO
              git commit -m "Update to version $TAG_VERSION"
              git push origin master
            '
